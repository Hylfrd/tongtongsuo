name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect the existing server without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tongtongsuo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect existing services (read only)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_path: deploy/inspect.sh

  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.inspect_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm audit --registry=https://registry.npmjs.org && npm test && npm run build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: true
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Check backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/deploy.sh deploy/inspect.sh
      - name: Resolve Python wheels for the matching Linux runtime
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: --report wheel-report.json pip -r backend/requirements.txt
          python deploy/wheels.py prepare wheel-report.json wheel-manifest.json
      - name: Package release
        run: |
          mkdir -p bundle
          printf '%s\n' "$GITHUB_SHA" > RELEASE
          tar --exclude='__pycache__' --exclude='*.pyc' -czf bundle/release.tar.gz RELEASE frontend/dist backend/app backend/requirements.txt deploy wheel-manifest.json
          cp deploy/deploy.sh bundle/deploy.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: bundle/
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: bundle
      - name: Upload release to its own directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
          destination="$SERVER_USER@$SERVER_HOST"
          remote_dir="/var/www/tongtongsuo/incoming/$DEPLOY_RUN"
          options=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          timeout 60s sshpass -e ssh "${options[@]}" "$destination" "mkdir -p '$remote_dir'"
          timeout --kill-after=15s 600s sshpass -e scp "${options[@]}" bundle/release.tar.gz bundle/deploy.sh "$destination:$remote_dir/"
          if [[ -n "$ADMIN_PASSWORD_HASH" ]]; then
            printf 'ADMIN_USERNAME=admin\nADMIN_PASSWORD_HASH=%s\n' "$ADMIN_PASSWORD_HASH" | \
              timeout 60s sshpass -e ssh "${options[@]}" "$destination" "umask 077; cat > '$remote_dir/admin.env'"
          fi
      - name: Activate release and verify HTTPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: RELEASE_SHA,DEPLOY_RUN
          command_timeout: 12m
          script: bash "/var/www/tongtongsuo/incoming/$DEPLOY_RUN/deploy.sh" "$RELEASE_SHA" "$DEPLOY_RUN"
