name: Add requested B cabinet preview data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tongtongsuo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Back up the database and add preview inventory once
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          SEED_RUN: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SEED_RUN
          command_timeout: 3m
          script: |
            set -eu
            systemctl is-active --quiet tongtongsuo
            release=$(readlink -f /var/www/tongtongsuo/current)
            test -f "$release/backend/app/seed_preview.py"
            systemd-run --quiet --wait --pipe --collect \
              --unit="tongtongsuo-preview-$SEED_RUN" \
              --property=DynamicUser=yes --property=User=tongtongsuo \
              --property=StateDirectory=tongtongsuo --property=StateDirectoryMode=0700 \
              --property="WorkingDirectory=$release/backend" \
              --setenv=PYTHONDONTWRITEBYTECODE=1 \
              "$release/.venv/bin/python" - <<'PY'
            import json
            import sqlite3
            from datetime import datetime, timezone
            from pathlib import Path
            from app.seed_preview import seed_preview
            from app.admin import usage_metrics

            database = Path('/var/lib/tongtongsuo/toolbox.sqlite3')
            backup = database.with_name('toolbox-before-preview-' + datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%f') + '.sqlite3')
            with sqlite3.connect(database.as_uri() + '?mode=rw', uri=True) as source, sqlite3.connect(backup) as target:
                source.backup(target)
            print('Database backup:', backup.name)
            print(json.dumps(seed_preview(database), ensure_ascii=False))
            with sqlite3.connect(database) as connection:
                connection.row_factory = sqlite3.Row
                print(json.dumps(usage_metrics(connection), ensure_ascii=False))
            PY
