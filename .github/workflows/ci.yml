name: CI and deploy

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect the existing server without deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tongtongsuo-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing services (read only)
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_path: deploy/inspect.sh
