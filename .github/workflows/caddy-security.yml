name: Caddy security maintenance

on:
  workflow_dispatch:
    inputs:
      apply_update:
        description: Replace the shared Linux Caddy binary after building and scanning
        type: boolean
        default: false
      reuse_build_run:
        description: Reuse the verified artifact from this successful build run instead of rebuilding
        type: string
        default: ''
      reuse_build_sha:
        description: Exact approved commit SHA of the reused build
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: tongtongsuo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.reuse_build_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: deploy/caddy-security/go.sum
      - name: Build and scan the fixed Caddy module graph
        working-directory: deploy/caddy-security
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go mod verify
          go build -mod=readonly -trimpath -ldflags '-X github.com/caddyserver/caddy/v2.CustomVersion=v2.11.7' -o ../../caddy github.com/caddyserver/caddy/v2/cmd/caddy
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode binary ../../caddy
          ../../caddy version
          ../../caddy build-info
      - name: Verify maintenance script and checksum
        run: |
          bash -n deploy/update-caddy.sh
          shellcheck deploy/update-caddy.sh
          sha256sum caddy > caddy.sha256
          gzip -n -9 caddy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caddy-security
          path: |
            caddy.gz
            caddy.sha256
            deploy/update-caddy.sh
          retention-days: 7

  update:
    needs: build
    if: always() && inputs.apply_update && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_build_run != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve a verified artifact and pass its short download URL privately
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BUILD_RUN: ${{ inputs.reuse_build_run || github.run_id }}
          EXPECTED_BUILD_SHA: ${{ inputs.reuse_build_sha || github.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          MAINTENANCE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
          destination="$SERVER_USER@$SERVER_HOST"
          remote_dir="/var/www/tongtongsuo/caddy-security/$MAINTENANCE_RUN"
          options=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          [[ "$SOURCE_BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_BUILD_RUN")
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_BUILD_SHA" '.path == ".github/workflows/caddy-security.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .head_sha == $sha and .repository.full_name == $repo and .head_repository.full_name == $repo' <<< "$run_json" >/dev/null
          jobs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_BUILD_RUN/jobs?filter=latest&per_page=100")
          jq -e '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length == 1' <<< "$jobs_json" >/dev/null
          artifact_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_BUILD_RUN/artifacts?per_page=100")
          artifact_id=$(jq -er '[.artifacts[] | select(.name == "caddy-security" and .expired == false)] | if length == 1 then .[0].id else error("Expected one verified artifact") end' <<< "$artifact_json")
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")
          repository_id=$(jq -er '.repository.id' <<< "$run_json")
          jq -e --argjson run "$SOURCE_BUILD_RUN" --argjson repo "$repository_id" --arg sha "$EXPECTED_BUILD_SHA" '.name == "caddy-security" and .expired == false and .workflow_run.id == $run and .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and .workflow_run.head_sha == $sha and .workflow_run.head_branch == "main"' <<< "$metadata" >/dev/null
          digest=$(jq -er '.digest' <<< "$metadata")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive_sha=${digest#sha256:}
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          code=$(curl --silent --show-error --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip")
          [[ "$code" == 302 ]]
          artifact_url=$(python3 - "$headers" <<'PY'
          import re, sys
          from urllib.parse import urlsplit
          headers = open(sys.argv[1], encoding="utf-8").read().splitlines()
          urls = [line.split(":", 1)[1].strip() for line in headers if line.lower().startswith("location:")]
          assert len(urls) == 1, "Expected one artifact redirect"
          url = urlsplit(urls[0])
          assert url.scheme == "https" and url.port in (None, 443) and not url.username and not url.password
          assert re.fullmatch(r"productionresultssa[0-9a-z]*\.blob\.core\.windows\.net", url.hostname or ""), "Unexpected artifact host"
          assert url.path.startswith("/actions-results/") and not url.fragment
          print(urls[0])
          PY
          )
          printf '::add-mask::%s\n' "$artifact_url"
          printf 'Verified build run %s at %s, artifact %s, archive SHA256 %s\n' "$SOURCE_BUILD_RUN" "$EXPECTED_BUILD_SHA" "$artifact_id" "$archive_sha"
          printf '%s\n%s\n' "$artifact_url" "$archive_sha" | timeout 60s sshpass -e ssh "${options[@]}" "$destination" "umask 077; mkdir -p '$remote_dir'; chmod 700 '$remote_dir'; cat > '$remote_dir/artifact-url'"
      - name: Pull over HTTPS, back up, validate, replace and verify Caddy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          MAINTENANCE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: MAINTENANCE_RUN
          command_timeout: 25m
          script_path: deploy/pull-caddy-artifact.sh
